name: Claude Code

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read lib/webhooks/verify-contentful-webhook-secret.ts and post a
            one-paragraph PR comment summarising any correctness or security
            issues you find.
          claude_args: "--max-turns 5"
          show_full_output: true
          settings: |
            {
              "permissions": {
                "allow": ["Bash(gh pr comment *)", "Bash(gh pr view *)", "Bash(git diff *)", "Bash(git show *)", "Read"]
              }
            }
