name: Claude Code

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR for correctness in the pure utility functions under
            lib/contentful/cda.ts, lib/webhooks/, lib/utils/, and
            lib/contentful/cma-rate-limit.ts. Focus on:
            - Edge cases or inputs that would produce incorrect results
            - Data shape assumptions (e.g. plain string vs locale map fields)
            - Auth/security logic in webhook verification
            - Rate limit error detection covering all error shapes
            Do not review functions that require Contentful or OpenAI network calls.
            Post your findings as a PR comment.
          claude_args: "--max-turns 5"# trigger ci
